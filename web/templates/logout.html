{{ template "header.html" . }}

<div class="theme-panel">
  {{ if .LoggedOut }}
  <h2 class="theme-heading">{{ .T "loggedOut" }}</h2>
  <div>
    <div class="dex-subtle-text">{{ .T "loggedOutDesc" }}</div>
  </div>
  {{ else }}
  <h2 class="theme-heading">{{ .T "sessionNotFound" }}</h2>
  <div>
    <div class="dex-subtle-text">{{ .T "sessionNotFoundDesc" }}</div>
  </div>
  {{ end }}

  {{ if .BackURL }}
  <div class="theme-form-row">
    <a href="{{ .BackURL }}" class="dex-subtle-text">{{ .T "backToApplication" }}</a>
  </div>
  {{ end }}

</div>

{{ template "footer.html" . }}
